<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corpus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Patrick+Hand&display=swap">
<style>
:root{
  --desk:#1d120b; --desk2:#4a2f1d;
  --paper:#e6d2a3; --paper-hi:#f3e6c2; --paper-lo:#c9ab70;
  --ink:#2a1d14; --ink2:#5b4630; --rust:#8a3b1e; --faint:rgba(42,29,20,.22);
  --leather:#4b2a16; --leather2:#2e180b; --gold:#b99654;
  --pw:420px; --ph:600px; --fs:16px;
  --serif:'IM Fell English','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sc:'IM Fell English SC','IM Fell English',Georgia,serif;
  --hand:'Patrick Hand','Segoe Print','Comic Sans MS',cursive;
}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);overflow:hidden}
*{box-sizing:border-box}
#desk{position:fixed;inset:0;font-family:var(--serif);
  background:radial-gradient(ellipse at 50% 38%,var(--desk2) 0%,var(--desk) 78%),var(--desk)}
#desk::before{content:"";position:absolute;inset:0;background:var(--noise);opacity:.5;pointer-events:none;mix-blend-mode:multiply}
#stage{position:absolute;inset:10px 10px 54px 10px;display:flex;align-items:center;justify-content:center;perspective:2600px}
#book{position:relative;width:calc(var(--pw)*2);height:var(--ph);flex:none;transform-style:preserve-3d;
  transform:translateX(calc(var(--pw)*-.5));transition:transform 1.4s cubic-bezier(.6,.05,.25,1)}
#book.opened,#book.single{transform:none}
#book.single{width:var(--pw)}
#spread{position:absolute;inset:0;opacity:0;transform-style:preserve-3d;transition:opacity .5s}
#book.opened #spread{opacity:1;transition-delay:.75s}
.paper{position:absolute;top:0;width:var(--pw);height:var(--ph);overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 45%,rgba(255,245,210,.5),rgba(255,245,210,0) 62%),
    var(--noise2),var(--noise),var(--paper);
  background-size:auto,1500px 1500px,auto,auto;
  box-shadow:inset 0 0 60px rgba(95,55,15,.38),0 2px 6px rgba(0,0,0,.45)}
.paper.left{left:0;border-radius:3px 0 0 3px;box-shadow:inset 0 0 60px rgba(95,55,15,.38),-5px 3px 0 -1px #cdb27a,-8px 5px 0 -2px #b99d65,0 8px 20px rgba(0,0,0,.5)}
.paper.right{left:var(--pw);border-radius:0 3px 3px 0;box-shadow:inset 0 0 60px rgba(95,55,15,.38),5px 3px 0 -1px #cdb27a,8px 5px 0 -2px #b99d65,0 8px 20px rgba(0,0,0,.5)}
#book.single .paper.right{left:0;border-radius:3px}
#book.single .paper.left{display:none}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none}
.paper.left::after{background:linear-gradient(to left,rgba(40,18,2,.5),rgba(40,18,2,.12) 7%,transparent 16%)}
.paper.right::after{background:linear-gradient(to right,rgba(40,18,2,.5),rgba(40,18,2,.12) 7%,transparent 16%)}
#book.single .paper.right::after{background:none}
.inner{position:absolute;inset:calc(var(--ph)*.075) calc(var(--pw)*.105) calc(var(--ph)*.095);overflow:hidden;
  font-size:var(--fs);line-height:1.42;color:var(--ink);text-shadow:0 0 .6px rgba(42,29,20,.55);hyphens:auto;-webkit-hyphens:auto}
.inner.k-front{overflow:auto}
#measure{position:absolute;left:-9999px;top:0;visibility:hidden;width:calc(var(--pw)*.79);height:calc(var(--ph)*.83);overflow:hidden;
  font-size:var(--fs);line-height:1.42;hyphens:auto;-webkit-hyphens:auto}
.run,.folio{position:absolute;font-family:var(--sc);color:var(--ink2);letter-spacing:.08em;font-size:calc(var(--fs)*.72)}
.run{top:calc(var(--ph)*.036);left:calc(var(--pw)*.105);right:calc(var(--pw)*.105);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.folio{bottom:calc(var(--ph)*.04);left:0;right:0;text-align:center}
.inner p,#measure p{margin:0 0 .55em;text-align:justify}
.inner p.cont,#measure p.cont{margin-top:0}
.inner p.lead::first-letter,#measure p.lead::first-letter{float:left;font-family:var(--sc);font-size:3.1em;line-height:.82;padding:.06em .09em 0 0;color:var(--rust)}
.inner p.li,#measure p.li{text-align:left;margin:0 0 .25em;padding-left:1.1em;text-indent:-1.1em}
.inner p.li::before,#measure p.li::before{content:"\2766\00a0";color:var(--rust);font-size:.8em}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
h1{font-family:var(--sc);font-size:2.05em;line-height:1.08;margin:.1em 0 .15em}
h2{font-family:var(--sc);font-size:1.4em;line-height:1.15;margin:.75em 0 .35em;color:var(--rust);border-bottom:1px solid var(--faint);padding-bottom:.12em}
h3{font-family:var(--serif);font-style:italic;font-size:1.12em;margin:.6em 0 .25em}
.sub{font-style:italic;color:var(--ink2);margin-bottom:.4em}
.srcline{font-size:.78em;color:var(--ink2);margin-bottom:.9em;border-bottom:1px solid var(--faint);padding-bottom:.5em}
a{color:var(--rust);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer}
.hw{font-family:var(--hand)}
.big{font-size:1.9em;line-height:1.15;margin:.1em 0 .5em}
.smallcap{font-family:var(--sc);letter-spacing:.07em;font-size:.82em;color:var(--ink2);margin-top:.9em}
.fr .alt{display:block;margin:.1em 0;font-family:var(--hand);font-size:1.12em}
.fr small,.note{display:block;font-size:.8em;line-height:1.35;color:var(--ink2)}
.warn{border:1px solid var(--rust);padding:.4em .55em;margin:.5em 0;font-size:.85em;line-height:1.35;color:var(--rust)}
.ix{display:flex;align-items:baseline;gap:.35em;padding:.12em 0;cursor:pointer;line-height:1.25}
.ix.l2{padding-left:1.3em;font-size:.92em;color:var(--ink2)}
.ix .t{flex:0 1 auto;min-width:0}
.ix .d{flex:1 1 1em;border-bottom:1px dotted var(--ink2);transform:translateY(-.25em);min-width:1em}
.ix .n{font-variant-numeric:tabular-nums}
.ix:hover .t{color:var(--rust)}
figure.plate{margin:.3em 0 .6em;width:var(--fw);}
figure.plate.r{float:right;margin-left:.9em}
figure.plate.l{float:left;margin-right:.9em}
figure.plate img{display:block;width:100%;height:var(--fh);object-fit:contain;mix-blend-mode:multiply;filter:sepia(.55) contrast(1.06)}
figure.plate img.broken{opacity:.15}
figcaption{font-size:.68em;line-height:1.28;color:var(--ink2);font-style:italic;margin-top:.25em}
.ref{margin:0 0 .55em;font-size:.9em;line-height:1.3;padding-left:1em;text-indent:-1em}
.ref b{font-weight:400;font-style:italic}
.nb{display:grid;grid-template-columns:1fr auto;gap:.1em .6em;margin:0 0 .4em;font-size:.95em}
.nb .bar{grid-column:1 / -1;height:.3em;background:var(--ink);opacity:.55;border-radius:2px;transform-origin:left;box-shadow:0 0 1px var(--ink)}
.nb .c{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.88em}
/* hand mode */
#desk.hand .inner,#desk.hand #measure{font-family:var(--hand);font-size:calc(var(--fs)*1.1);line-height:1.38;letter-spacing:.01em}
#desk.hand h1,#desk.hand h2,#desk.hand h3{font-family:var(--hand);font-weight:700;font-style:normal;text-transform:none}
#desk.hand .inner p{text-align:left;hyphens:manual}
/* cover */
#cover{position:absolute;top:0;left:var(--pw);width:var(--pw);height:var(--ph);transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1.4s cubic-bezier(.6,.05,.25,1);z-index:5}
#book.single #cover{left:0}
#cover.open{transform:rotateY(-180deg)}
.cf,.cb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px 12px 12px 3px}
.cf{background:radial-gradient(ellipse at 40% 30%,rgba(255,220,170,.14),transparent 60%),var(--noise),linear-gradient(100deg,var(--leather2),var(--leather) 12%,var(--leather) 80%,var(--leather2));
  box-shadow:0 14px 34px rgba(0,0,0,.65),inset 0 0 0 1px rgba(0,0,0,.4),inset 3px 0 6px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--ph)*.07) calc(var(--pw)*.1)}
.cf::before{content:"";position:absolute;inset:calc(var(--ph)*.03) calc(var(--pw)*.045);border:2px solid rgba(185,150,84,.55);border-radius:2px;pointer-events:none;box-shadow:inset 0 0 0 4px rgba(75,42,22,.9),inset 0 0 0 5px rgba(185,150,84,.3)}
.cb{transform:rotateY(180deg);background:var(--noise2),var(--noise),#6b4a2a;box-shadow:inset 0 0 40px rgba(30,12,0,.5)}
.ctitle{font-family:var(--sc);color:var(--gold);letter-spacing:.32em;font-size:calc(var(--fs)*1.9);text-shadow:0 1px 0 rgba(0,0,0,.7),0 0 1px rgba(255,230,160,.4);margin-top:calc(var(--ph)*.03);padding-left:.32em;text-align:center}
.cmeta{font-family:var(--serif);font-style:italic;color:var(--gold);opacity:.85;text-align:center;font-size:calc(var(--fs)*.78);text-shadow:0 1px 0 rgba(0,0,0,.6)}
.label{position:relative;width:100%;padding:calc(var(--ph)*.03) calc(var(--pw)*.06) calc(var(--ph)*.025);transform:rotate(-.6deg);
  background:var(--noise2),var(--noise),var(--paper-hi);box-shadow:0 2px 5px rgba(0,0,0,.55),inset 0 0 22px rgba(120,80,30,.35);color:var(--ink)}
.label .q{font-family:var(--hand);font-size:calc(var(--fs)*1.12);margin:0 0 .35em;color:var(--ink2)}
.label input{display:block;width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--ink2);border-radius:0;padding:.15em 0;
  font-family:var(--hand);font-size:calc(var(--fs)*1.45);color:var(--ink);outline:none;caret-color:var(--rust);text-shadow:0 0 .6px rgba(42,29,20,.6)}
.label input:focus{border-bottom-color:var(--rust)}
.label .go{margin-top:.6em;display:flex;justify-content:space-between;align-items:center;gap:.5em}
.label .hint{font-style:italic;font-size:calc(var(--fs)*.78);color:var(--ink2)}
.label button{font-family:var(--hand);font-size:calc(var(--fs)*1.1);background:transparent;color:var(--rust);border:1.5px solid var(--rust);border-radius:2px;padding:.1em .7em;cursor:pointer}
.label button:hover,.label button:focus-visible{background:var(--rust);color:var(--paper-hi);outline:none}
#status{min-height:2.6em;margin-top:.5em;font-family:var(--hand);color:var(--rust);font-size:calc(var(--fs)*1)}
/* leaves */
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;transition:transform .95s cubic-bezier(.5,.05,.3,1);z-index:4}
.leaf.fwd{left:var(--pw);transform-origin:left center}
.leaf.bwd{left:0;transform-origin:right center}
.leaf.fwd.go{transform:rotateY(-180deg)}
.leaf.bwd.go{transform:rotateY(180deg)}
.leaf .paper{position:absolute;left:0;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .paper.b{transform:rotateY(180deg)}
.fade{opacity:0;transition:opacity .16s}
/* bar */
#bar{position:absolute;left:0;right:0;bottom:0;height:54px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;
  padding-bottom:env(safe-area-inset-bottom,0px);font-family:var(--sc);color:#d9bd86;transition:opacity .6s}
#bar.hid{opacity:0;pointer-events:none}
#bar button{font:inherit;font-size:15px;letter-spacing:.06em;color:#d9bd86;background:rgba(0,0,0,.25);border:1px solid rgba(217,189,134,.35);border-radius:3px;min-width:40px;height:34px;padding:0 10px;cursor:pointer}
#bar button:hover,#bar button:focus-visible{background:rgba(217,189,134,.18);outline:none}
#bar button:disabled{opacity:.3;cursor:default}
#bar .sep{width:1px;height:20px;background:rgba(217,189,134,.3);margin:0 6px}
#bar .pl{min-width:5.5em;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
@media (max-width:700px){#bar .lbl{display:none}}
@media (prefers-reduced-motion:reduce){#book,#cover,.leaf,#spread{transition:none!important}}
</style>
</head>
<body>
<div id="desk" lang="en">
  <div id="stage">
    <div id="book">
      <div id="spread"><div class="paper left" id="pgL"></div><div class="paper right" id="pgR"></div></div>
      <div id="cover">
        <div class="cf">
          <div class="ctitle">CORPUS</div>
          <form class="label" id="form" autocomplete="off">
            <div class="q"><label for="q">What would you learn of the body? Write it here:</label></div>
            <input id="q" type="text" maxlength="80" spellcheck="false" autocapitalize="off" autocomplete="off">
            <div class="go"><span class="hint">then press Enter</span><button type="submit">write it in</button></div>
            <div id="status" role="status" aria-live="polite"></div>
          </form>
          <div class="cmeta">assembled from Wikipedia, Wikimedia Commons &amp; Europe PMC<br>no page of it written by a machine</div>
        </div>
        <div class="cb"></div>
      </div>
    </div>
  </div>
  <div id="measure" class="inner"></div>
  <div id="bar" class="hid">
    <button id="prev" aria-label="Previous page" title="Previous page">&#8249;</button>
    <span class="pl" id="pl"></span>
    <button id="next" aria-label="Next page" title="Next page">&#8250;</button>
    <span class="sep"></span>
    <button id="bHand" title="Switch between printed type and handwriting">Aa<span class="lbl"> hand / print</span></button>
    <button id="bFull" title="Full screen">&#9974;<span class="lbl"> full screen</span></button>
    <button id="bNew" title="Write a new topic">&#9998;<span class="lbl"> new topic</span></button>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement;

/* ---------- paper textures (generated, no images) ---------- */
(function(){
  const n1="<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .30  0 0 0 0 .18  0 0 0 0 .06  0 0 0 .30 0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>";
  const n2="<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.012 .02' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .52  0 0 0 0 .32  0 0 0 0 .10  0 0 0 .55 -.12'/></filter><rect width='100%' height='100%' filter='url(#m)'/></svg>";
  root.style.setProperty('--noise','url("data:image/svg+xml,'+encodeURIComponent(n1)+'")');
  root.style.setProperty('--noise2','url("data:image/svg+xml,'+encodeURIComponent(n2)+'")');
})();

/* ---------- data: real sources only ---------- */
const WP='https://en.wikipedia.org/w/api.php?';
const CM='https://commons.wikimedia.org/w/api.php?';
const EP='https://www.ebi.ac.uk/europepmc/webservices/rest/search?';
const qs=o=>new URLSearchParams(o).toString();
async function getJSON(url,ms){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||15000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  finally{clearTimeout(t);}
}
const cleanTitle=t=>String(t).replace(/\s*\([^)]*\)\s*$/,'').replace(/"/g,'').trim();
const plain=h=>{try{return new DOMParser().parseFromString(String(h||''),'text/html').body.textContent.replace(/\s+/g,' ').trim();}catch(e){return '';}};
const WPB={format:'json',formatversion:2,origin:'*'};

async function wpCandidates(q){
  const j=await getJSON(WP+qs({...WPB,action:'query',generator:'search',gsrsearch:q,gsrlimit:8,prop:'pageprops|description',ppprop:'disambiguation'}));
  const pages=((j.query&&j.query.pages)||[]).slice().sort((a,b)=>a.index-b.index);
  return pages.filter(p=>!(p.pageprops&&('disambiguation' in p.pageprops)));
}
async function wpArticle(title){
  const j=await getJSON(WP+qs({...WPB,action:'query',prop:'extracts|links|info',titles:title,redirects:1,explaintext:1,exsectionformat:'wiki',pllimit:150,plnamespace:0,inprop:'url'}),20000);
  const pg=j.query.pages[0];
  return {title:pg.title,text:pg.extract||'',url:pg.fullurl||('https://en.wikipedia.org/wiki/'+encodeURIComponent(pg.title.replace(/ /g,'_'))),links:(pg.links||[]).map(l=>l.title)};
}
async function platesFor(term,limit){
  const j=await getJSON(CM+qs({...WPB,action:'query',generator:'search',gsrnamespace:6,gsrsearch:term+' incategory:"Gray\'s Anatomy plates"',gsrlimit:limit,prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:520}));
  const pages=((j.query&&j.query.pages)||[]).slice().sort((a,b)=>a.index-b.index);
  const out=[];
  for(const p of pages){
    const ii=p.imageinfo&&p.imageinfo[0];if(!ii||!ii.thumburl)continue;
    const em=ii.extmetadata||{};
    let cap=plain(em.ImageDescription&&em.ImageDescription.value);
    if(!cap)cap=p.title.replace(/^File:/,'').replace(/\.[a-z]+$/i,'');
    if(cap.length>230)cap=cap.slice(0,230).replace(/\s+\S*$/,'')+'\u2026';
    out.push({title:p.title.replace(/^File:/,''),thumb:ii.thumburl,w:ii.thumbwidth||520,h:ii.thumbheight||520,page:ii.descriptionurl,caption:cap,license:plain(em.LicenseShortName&&em.LicenseShortName.value)||'see Commons page'});
  }
  return out;
}
const eppQ=phrase=>'TITLE_ABS:"'+phrase+'"';
async function papersFor(phrase){
  const base={query:eppQ(phrase),format:'json',resultType:'lite'};
  const [a,b]=await Promise.all([getJSON(EP+qs({...base,pageSize:6})),getJSON(EP+qs({...base,pageSize:4,sort:'P_PDATE_D desc'}))]);
  const map=r=>({title:plain(r.title),authors:r.authorString||'',journal:r.journalTitle||'',year:r.pubYear||'',url:'https://europepmc.org/article/'+r.source+'/'+r.id});
  return {status:'ok',phrase,hits:a.hitCount||0,top:((a.resultList&&a.resultList.result)||[]).map(map),recent:((b.resultList&&b.resultList.result)||[]).map(map)};
}
async function countFor(phrase){
  try{const j=await getJSON(EP+qs({query:eppQ(phrase),format:'json',resultType:'lite',pageSize:1}),12000);return j.hitCount;}catch(e){return null;}
}
const SKIPLINK=/^(list of|index of|outline of|category|help|wikipedia|template|portal)\b|^\d|\bISBN\b|\bdoi\b/i;
function pickNeighbours(links,selfTitle){
  const seen=new Set([selfTitle.toLowerCase()]),out=[];
  for(const l of links){
    const c=cleanTitle(l);const k=c.toLowerCase();
    if(!c||c.length>34||seen.has(k)||SKIPLINK.test(c))continue;
    seen.add(k);out.push(c);if(out.length>=14)break;
  }
  return out;
}

async function gather(q){
  const d={query:q,matched:null,alternatives:[],wikiText:'',plates:[],platesStatus:'none',papers:null,neighbours:{status:'none',items:[],from:''},notes:[],demo:false};
  const cands=await wpCandidates(q); // a throw here = cannot reach Wikipedia at all
  let phrase=cleanTitle(q),links=[];
  if(cands.length){
    d.matched={title:cands[0].title,desc:cands[0].description||''};
    d.alternatives=cands.slice(1,6).map(p=>({title:p.title,desc:p.description||''}));
    phrase=cleanTitle(cands[0].title);
  }
  const jobs=[];
  if(d.matched){
    jobs.push(wpArticle(d.matched.title).then(a=>{d.wikiText=a.text;d.matched.title=a.title;d.matched.url=a.url;links=a.links;phrase=cleanTitle(a.title);}).catch(e=>{d.notes.push('The Wikipedia article text could not be loaded ('+e.message+').');}));
    jobs.push(platesFor(cleanTitle(d.matched.title),3).then(p=>{d.plates=p;d.platesStatus=p.length?'ok':'none';}).catch(e=>{d.platesStatus='error';}));
  }
  const phraseForPapers=cleanTitle(d.matched?d.matched.title:q);
  jobs.push(papersFor(phraseForPapers).then(p=>{d.papers=p;}).catch(e=>{d.papers={status:'error',phrase:phraseForPapers,error:e.message};}));
  await Promise.all(jobs);
  // neighbours
  let names=[];
  if(d.matched){names=pickNeighbours(links,cleanTitle(d.matched.title));d.neighbours.from='links';}
  else{
    const words=q.split(/\s+/).filter(w=>w.length>3).slice(0,3);
    const res=await Promise.all(words.map(w=>getJSON(WP+qs({...WPB,action:'query',list:'search',srsearch:w,srlimit:5,srprop:''})).then(j=>j.query.search.map(s=>s.title)).catch(()=>[])));
    const seen=new Set();res.flat().forEach(t=>{const c=cleanTitle(t);if(!seen.has(c.toLowerCase())&&names.length<12){seen.add(c.toLowerCase());names.push(c);}});
    d.neighbours.from='words';
  }
  if(names.length){
    const counts=await Promise.all(names.map(countFor));
    d.neighbours.items=names.map((n,i)=>({title:n,hits:counts[i]}));
    d.neighbours.status='ok';
  }
  // related plates when the entry itself has none
  if(d.matched&&d.platesStatus==='none'&&names.length){
    const tryNames=names.slice(0,6);
    const rs=await Promise.all(tryNames.map(n=>platesFor(n,2).catch(()=>[])));
    for(let i=0;i<rs.length;i++){if(rs[i].length){d.plates=rs[i].map(p=>({...p,related:tryNames[i]}));d.platesStatus='related';break;}}
  }
  return d;
}

function demoData(q,err){
  return {query:q,demo:true,demoReason:String(err&&err.message||err||'blocked'),
    matched:{title:'Rete ovarii',desc:'',url:'https://en.wikipedia.org/wiki/Rete_ovarii'},alternatives:[],
    wikiText:'The rete ovarii (pl.: retia ovarii) is a structure formed from the primary sex cords in females.\nIt is the homologue of the rete testis in males.',
    plates:[],platesStatus:'demo',papers:{status:'demo'},neighbours:{status:'demo',items:[],from:'links'},notes:[]};
}

/* ---------- turning data into blocks ---------- */
const SKIPSEC=/^(see also|references|external links|further reading|notes|bibliography|sources|citations|footnotes|gallery)$/i;
function parseWiki(txt){
  const out=[];let cur={lvl:0,title:null,paras:[]};out.push(cur);
  String(txt).split(/\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    const m=line.match(/^(={2,6})\s*(.+?)\s*\1$/);
    if(m){cur={lvl:m[1].length,title:m[2],paras:[]};out.push(cur);return;}
    cur.paras.push(line);
  });
  return out;
}
function buildBlocks(d){
  const B=[],T=[];let aid=0;
  const raw=h=>B.push({k:'raw',html:h});
  const H=(tag,label,lvl,toc)=>{const id=aid++;raw('<'+tag+' data-a="'+id+'">'+esc(label)+'</'+tag+'>');if(toc!==false)T.push({lvl:lvl,label:label,id:id});return id;};
  const P=(text,cls)=>B.push({k:'p',text:text,cls:cls||''});
  const title=d.matched?d.matched.title:d.query;
  const queue=d.plates.slice();let figN=0;
  const pushPlate=()=>{if(!queue.length)return;const p=queue.shift();const id=aid++;B.push({k:'fig',p:p,side:(figN++%2)?'l':'r',id:id});T.push({lvl:2,label:'Plate \u2014 '+(p.caption.length>46?p.caption.slice(0,46).replace(/\s+\S*$/,'')+'\u2026':p.caption),id:id});};

  if(d.matched){
    const id=aid++;
    raw('<h1 data-a="'+id+'">'+esc(title)+'</h1>'+(d.matched.desc?'<div class="sub">'+esc(d.matched.desc)+'</div>':'')+'<div class="srcline">From the Wikipedia entry \u201c'+esc(title)+'\u201d, set here without alteration.</div>');
    T.push({lvl:1,label:'The entry: '+title,id:id});
    const secs=parseWiki(d.wikiText);let skip=false,skipLvl=0,h2n=0,first=true;
    for(const s of secs){
      if(s.title){
        if(skip&&s.lvl>skipLvl)continue;
        skip=false;
        if(SKIPSEC.test(s.title)){skip=true;skipLvl=s.lvl;continue;}
        if(s.lvl===2){h2n++;if(h2n>1)pushPlate();H('h2',s.title,1);}
        else H('h3',s.title,2);
      }
      s.paras.forEach(t=>{
        const isLi=t.length<64&&!/[.!?:;]$/.test(t);
        if(isLi)P(t,'li');
        else{P(t,first&&!s.title?'lead':'');if(first&&!s.title){first=false;pushPlate();}}
      });
    }
    if(!d.wikiText.trim()){P('The entry was found, but its text could not be loaded just now.');}
    while(queue.length)pushPlate();
  }else{
    const id=aid++;
    raw('<h1 data-a="'+id+'">\u201c'+esc(d.query)+'\u201d</h1><div class="sub">No Wikipedia entry matched.</div>');
    T.push({lvl:1,label:'Nothing matched \u201c'+d.query+'\u201d',id:id});
    P('Wikipedia\u2019s own search returned no entry for what was written on the cover. This page says so plainly rather than inventing something. The next pages show what the research databases hold, and nearby subjects.');
  }
  /* plates status note */
  if(d.platesStatus==='none'||d.platesStatus==='error'||d.platesStatus==='demo'){
    const msg={none:'No anatomical plate from Gray\u2019s Anatomy matched this entry on Wikimedia Commons, so this book shows none. It does not draw one.',
      error:'Wikimedia Commons could not be reached, so no plates are shown. This says nothing about whether plates exist.',
      demo:'Plates would appear here, loaded live from Wikimedia Commons. This preview is not allowed to reach it.'}[d.platesStatus];
    if(d.matched)raw('<div class="note" style="margin-top:.8em">'+esc(msg)+'</div>');
  }
  /* research record */
  B.push({k:'break'});
  H('h2','The research record',1);
  const pp=d.papers;
  if(pp&&pp.status==='ok'){
    P(pp.hits>0
      ?'Europe PMC, a free index of biomedical literature, lists '+pp.hits.toLocaleString('en')+' record'+(pp.hits===1?'':'s')+' with \u201c'+pp.phrase+'\u201d in the title or abstract.'
      :'Europe PMC lists no records with \u201c'+pp.phrase+'\u201d in the title or abstract. That does not prove nobody has studied it: the work may sit under another name, in older books, or outside what this index covers. Treat it as a sign of a thinly documented subject, not as proof.');
    if(pp.top.length){H('h3','Most relevant',2,false);pp.top.forEach(r=>raw(refHTML(r)));}
    if(pp.recent.length){H('h3','Most recent',2,false);pp.recent.forEach(r=>raw(refHTML(r)));}
  }else if(pp&&pp.status==='demo'){
    P('This page lists real papers from Europe PMC, counted and linked live. This preview is not allowed to reach that database, so it is empty here.');
  }else{
    P('Europe PMC could not be reached, so this page is empty. That says nothing about the research itself.');
  }
  /* neighbours */
  B.push({k:'break'});
  H('h2','Neighbouring subjects',1);
  const nb=d.neighbours;
  if(nb.status==='ok'&&nb.items.length){
    P(d.matched?'Subjects this entry links to, with the number of Europe PMC records that mention each in title or abstract, fewest first. Touch a name to write it into the book instead.':'Subjects whose names share a word with what you wrote, fewest records first. Touch a name to write it into the book instead.');
    raw('<div class="note" style="margin-bottom:.7em">A low count can mean a subject is little studied, or that researchers use another name for it. It is a pointer, not a verdict.</div>');
    const items=nb.items.slice().sort((a,b)=>(a.hits==null)-(b.hits==null)||(a.hits||0)-(b.hits||0));
    const max=Math.max(1,...items.map(i=>i.hits||0));
    items.forEach(it=>{
      const w=it.hits==null?0:Math.max(2,Math.round(Math.log10(it.hits+1)/Math.log10(max+1)*100));
      raw('<div class="nb"><a data-q="'+esc(it.title)+'">'+esc(it.title)+'</a><span class="c">'+(it.hits==null?'not counted':it.hits.toLocaleString('en')+' record'+(it.hits===1?'':'s'))+'</span><span class="bar" style="width:'+w+'%"></span></div>');
    });
  }else if(nb.status==='demo'){
    P('Here the book lists related subjects and how many papers mention each, fewest first, so the thinly researched corners show up. This preview cannot reach the databases.');
  }else{
    P('No neighbouring subjects could be gathered for this search.');
  }
  /* colophon */
  B.push({k:'break'});
  H('h2','Colophon',1);
  if(d.demo)raw('<div class="warn">Sample mode: the live databases could not be reached from here ('+esc(d.demoReason)+'). The two sentences in this book are copied from the Wikipedia page \u201cRete ovarii\u201d; everything else is empty rather than invented.</div>');
  if(d.matched)P('Text: Wikipedia, \u201c'+title+'\u201d, licensed CC BY-SA 4.0. The full list of authors is in the page history.');
  if(d.matched&&d.matched.url)raw('<p><a href="'+esc(d.matched.url)+'" target="_blank" rel="noopener noreferrer">Read the entry on Wikipedia</a></p>');
  if(d.plates.length){
    P('Plates, from Wikimedia Commons (illustrations from Gray\u2019s Anatomy, long out of copyright):');
    d.plates.forEach(p=>raw('<p class="li"><a href="'+esc(p.page)+'" target="_blank" rel="noopener noreferrer">'+esc(p.title)+'</a> \u2014 '+esc(p.license)+(p.related?' \u2014 shown because the entry links to \u201c'+esc(p.related)+'\u201d':'')+'</p>'));
    P('The plates are old engravings, printed in black and given a sepia tint here. They show the standard anatomy of their day, not necessarily the exact thing you searched, and later work has corrected parts of it.');
  }
  P('Papers and counts: Europe PMC (europepmc.org). Search ordering comes from Wikipedia\u2019s and Europe PMC\u2019s own search engines.');
  P('No word in this book was written, chosen or summarised by an AI. Code assembles the pages from the three sources above.');
  P('This is a teaching book, not medical advice or a diagnosis. For anything about your own health, ask a clinician.');
  d.notes.forEach(n=>P(n));
  return {blocks:B,toc:T};
}
function refHTML(r){
  const au=r.authors.length>90?r.authors.slice(0,90).replace(/[,\s]+\S*$/,'')+', et al.':r.authors;
  return '<div class="ref">'+esc(au)+(au?' ':'')+'<b>'+esc(r.title)+'</b> '+esc(r.journal)+(r.year?' ('+esc(r.year)+')':'')+' \u2014 <a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">open</a></div>';
}

/* ---------- layout & pagination ---------- */
let single=false,DATA=null,PAGES=[],KINDS=[],pos=0,busy=false,RUN='';
function setDims(){
  const st=$('stage');const W=st.clientWidth-0,H=st.clientHeight;
  single=innerWidth<760;
  let pw,ph;
  if(single){pw=Math.min(W-12,560);ph=Math.min(H,pw*1.6);}
  else{ph=Math.min(H,(W/2)/0.72);pw=ph*0.72;}
  pw=Math.floor(pw);ph=Math.floor(ph);
  root.style.setProperty('--pw',pw+'px');root.style.setProperty('--ph',ph+'px');
  root.style.setProperty('--fs',Math.max(14,Math.min(ph/38,pw/21,23)).toFixed(2)+'px');
  $('book').classList.toggle('single',single);
  return {pw,ph};
}
function figHTML(b){
  const m=$('measure');const iw=m.clientWidth,ih=m.clientHeight;
  const p=b.p;const s=Math.min(iw*.42/p.w,ih*.3/p.h,1.25);
  const w=Math.round(p.w*s),h=Math.round(p.h*s);
  const cap=esc(p.caption)+' <br><span>'+(p.related?'Related, not the same subject: shown because this entry links to \u201c'+esc(p.related)+'\u201d. ':'')+'Plate from Gray\u2019s Anatomy \u00b7 '+esc(p.license)+'</span>';
  return '<figure class="plate '+b.side+'" data-a="'+b.id+'" style="--fw:'+w+'px;--fh:'+h+'px"><img src="'+esc(p.thumb)+'" alt="'+esc('Old anatomical plate: '+p.title)+'" width="'+w+'" height="'+h+'"><figcaption>'+cap+'</figcaption></figure>';
}
function paginate(blocks){
  const m=$('measure');m.innerHTML='';const pages=[];
  const fits=()=>m.scrollHeight<=m.clientHeight+1;
  function newPage(){
    const carry=[];
    while(m.children.length>1&&m.lastElementChild.matches('h1,h2,h3,.srcline,.sub')){carry.unshift(m.lastElementChild);m.removeChild(m.lastElementChild);}
    pages.push(m.innerHTML);m.innerHTML='';carry.forEach(c=>m.appendChild(c));
  }
  function mk(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function addP(text,cls){
    let p=mk('p',cls,text);m.appendChild(p);
    if(fits())return;
    m.removeChild(p);
    const units=(text.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g)||[text]).map(u=>u.trim()).filter(Boolean);
    let node=mk('p',cls,'');m.appendChild(node);let acc='';
    for(const u of units){
      const t=acc?acc+' '+u:u;node.textContent=t;
      if(fits()){acc=t;continue;}
      if(acc){node.textContent=acc;newPage();node=mk('p',(cls?cls.replace('lead','')+' ':'')+'cont',u);m.appendChild(node);acc=u;}
      else if(m.children.length>1){m.removeChild(node);newPage();node=mk('p',(cls?cls.replace('lead','')+' ':'')+'cont',u);m.appendChild(node);acc=u;}
      else{acc=t;}
    }
    node.textContent=acc;
  }
  function addRaw(html){
    const w=document.createElement('div');w.innerHTML=html;const el=w.firstElementChild||document.createElement('span');
    m.appendChild(el);
    if(fits())return;
    if(m.children.length>1){
      m.removeChild(el);newPage();m.appendChild(el);
    }
  }
  for(const b of blocks){
    if(b.k==='break'){if(m.children.length)newPage();continue;}
    if(b.k==='p')addP(b.text,b.cls);
    else if(b.k==='fig')addRaw(figHTML(b));
    else{
      const w=document.createElement('div');w.innerHTML=b.html;
      const kids=[...w.children];
      if(kids.length>1){kids.forEach(k=>addRaw(k.outerHTML));}else addRaw(b.html);
    }
  }
  if(m.children.length)newPage();
  m.innerHTML='';
  return pages;
}
function anchorsOf(pages){const a={};pages.forEach((h,i)=>{const re=/data-a="(\d+)"/g;let x;while((x=re.exec(h)))if(!(x[1] in a))a[x[1]]=i;});return a;}

function frontHTML(d){
  let h='<div class="fr"><div class="smallcap" style="margin-top:0">Written in this book</div><div class="hw big">\u201c'+esc(d.query)+'\u201d</div>';
  if(d.demo)h+='<div class="warn">Could not reach the live sources from here ('+esc(d.demoReason)+'). Showing a small sample so you can see the book. Hosted normally, it searches Wikipedia, Commons and Europe PMC live.</div>';
  if(d.matched){
    h+='<div class="smallcap">The archive answered with</div><div style="font-size:1.25em;line-height:1.2"><b style="font-weight:400">'+esc(d.matched.title)+'</b>'+(d.matched.desc?'<br><i style="font-size:.8em">'+esc(d.matched.desc)+'</i>':'')+'</div>';
    h+='<small>It follows the entry it found, which is not always the thing you meant. If it is wrong, choose another below.</small>';
    if(d.alternatives.length){h+='<div class="smallcap">Other entries it might have meant</div>';d.alternatives.forEach(a=>{h+='<a class="alt" data-q="'+esc(a.title)+'">'+esc(a.title)+(a.desc?' <small style="display:inline;font-family:var(--serif)">\u2014 '+esc(a.desc)+'</small>':'')+'</a>';});}
  }else{
    h+='<div class="smallcap">The archive answered with</div><div style="font-size:1.1em">Nothing. No entry matched.</div><small>The pages inside say what could still be found, and which neighbouring subjects are thinly written about.</small>';
  }
  h+='<div class="smallcap">How to use it</div><small>Turn pages with the arrows below, the arrow keys, or by swiping. Touch a line in the index to go there.</small></div>';
  return h;
}
function ixRows(toc,base,fin){
  const rows=[];
  toc.forEach(t=>{
    const rel=fin?fin[t.id]:0;const abs=base+(rel||0);
    rows.push({k:'raw',html:'<div class="ix l'+t.lvl+'" role="link" tabindex="0" data-go="'+abs+'"><span class="t">'+esc(t.label)+'</span><span class="d"></span><span class="n">'+(abs+1)+'</span></div>'});
  });
  return rows;
}
async function fontsReady(){
  try{await Promise.race([Promise.all(['1em "IM Fell English"','italic 1em "IM Fell English"','1em "IM Fell English SC"','1em "Patrick Hand"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,3500))]);}catch(e){}
}
async function layout(){
  setDims();await fontsReady();
  const d=DATA;const {blocks,toc}=buildBlocks(d);
  const body=paginate(blocks);const anch=anchorsOf(body);
  const head={k:'raw',html:'<h2 style="margin-top:0">Index</h2>'};
  const note={k:'raw',html:'<div class="note" style="margin-bottom:.6em">What is on which page. Touch a line to turn to it.</div>'};
  const probe=paginate([head,note,...ixRows(toc,0,null)]);
  const k=probe.length;
  const ixPages=paginate([head,note,...ixRows(toc,1+k,anch)]);
  const k2=ixPages.length;
  let pages=[frontHTML(d),...ixPages,...body];
  let kinds=['front',...ixPages.map(()=>'ix'),...body.map(()=>'body')];
  if(k2!==k){
    const again=paginate([head,note,...ixRows(toc,1+k2,anch)]);
    pages=[frontHTML(d),...again,...body];kinds=['front',...again.map(()=>'ix'),...body.map(()=>'body')];
  }
  if(pages.length%2){pages.push('');kinds.push('blank');}
  PAGES=pages;KINDS=kinds;RUN=d.matched?d.matched.title:d.query;
}
function pageHTML(i){
  if(i<0||i>=PAGES.length)return '';
  const k=KINDS[i];
  if(k==='blank')return '';
  return '<div class="inner k-'+k+'">'+PAGES[i]+'</div>'+(k==='front'?'':'<div class="run">'+esc(RUN)+'</div><div class="folio">'+(i+1)+'</div>');
}
function render(){
  if(single){$('pgR').innerHTML=pageHTML(pos);}
  else{$('pgL').innerHTML=pageHTML(pos);$('pgR').innerHTML=pageHTML(pos+1);}
  updateBar();
}
function updateBar(){
  const n=PAGES.length;
  $('pl').textContent=single?(pos+1)+' / '+n:(pos+1)+'\u2013'+Math.min(pos+2,n)+' / '+n;
  $('prev').disabled=pos<=0;
  $('next').disabled=pos+(single?1:2)>=n;
}
function go(t){
  if(busy||!PAGES.length)return;
  t=Math.max(0,Math.min(PAGES.length-1,t));if(!single)t-=t%2;
  if(t===pos)return;
  if(REDUCED){pos=t;render();return;}
  if(single){busy=true;const r=$('pgR');r.classList.add('fade');setTimeout(()=>{pos=t;render();r.classList.remove('fade');busy=false;},170);return;}
  busy=true;const fwd=t>pos;const host=$('spread');
  const leaf=document.createElement('div');leaf.className='leaf '+(fwd?'fwd':'bwd');
  const f=document.createElement('div'),b=document.createElement('div');
  f.className='paper f '+(fwd?'right':'left');b.className='paper b '+(fwd?'left':'right');
  f.style.left=b.style.left='0';
  if(fwd){f.innerHTML=pageHTML(pos+1);b.innerHTML=pageHTML(t);$('pgR').innerHTML=pageHTML(t+1);}
  else{f.innerHTML=pageHTML(pos);b.innerHTML=pageHTML(t+1);$('pgL').innerHTML=pageHTML(t);}
  leaf.appendChild(f);leaf.appendChild(b);host.appendChild(leaf);
  void leaf.offsetWidth;leaf.classList.add('go');
  setTimeout(()=>{pos=t;render();leaf.remove();busy=false;},990);
}

/* ---------- opening, closing, searching ---------- */
function setStatus(t){$('status').textContent=t||'';}
function goFull(){try{const e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen){const p=e.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}}catch(e){}}
function openBook(){
  const c=$('cover');$('book').classList.add('opened');c.classList.add('open');$('bar').classList.remove('hid');
  setTimeout(()=>{if(c.classList.contains('open'))c.style.display='none';},REDUCED?0:1500);
}
function closeBook(){
  const c=$('cover');c.style.display='';void c.offsetWidth;c.classList.remove('open');
  $('book').classList.remove('opened');$('bar').classList.add('hid');
}
let searching=false;
async function submitQuery(q){
  q=q.trim();if(!q||searching)return;searching=true;
  goFull();$('q').disabled=true;setStatus('Looking through the archive\u2026');
  let d;
  try{d=await gather(q);}
  catch(err){d=demoData(q,err);}
  DATA=d;pos=0;
  try{await layout();}catch(e){setStatus('Something went wrong setting the pages: '+e.message);$('q').disabled=false;searching=false;return;}
  render();setStatus('');openBook();$('q').disabled=false;searching=false;
}
function newTopic(prefill,auto){
  closeBook();$('q').value=prefill||'';setStatus('');
  if(auto){setTimeout(()=>submitQuery(prefill),REDUCED?0:1500);}
  else setTimeout(()=>$('q').focus(),REDUCED?0:1400);
}

/* ---------- events ---------- */
$('form').addEventListener('submit',e=>{e.preventDefault();submitQuery($('q').value);});
$('prev').addEventListener('click',()=>go(pos-(single?1:2)));
$('next').addEventListener('click',()=>go(pos+(single?1:2)));
$('bFull').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen();}else goFull();});
$('bNew').addEventListener('click',()=>newTopic('',false));
$('bHand').addEventListener('click',async()=>{
  $('desk').classList.toggle('hand');
  try{localStorage.setItem('corpus-hand',$('desk').classList.contains('hand')?'1':'0');}catch(e){}
  if(DATA){const ratio=pos/Math.max(1,PAGES.length);await layout();pos=Math.min(PAGES.length-1,Math.round(ratio*PAGES.length));if(!single)pos-=pos%2;render();}
});
$('book').addEventListener('click',e=>{
  const q=e.target.closest('[data-q]');if(q){e.preventDefault();newTopic(q.getAttribute('data-q'),true);return;}
  const g=e.target.closest('[data-go]');if(g){go(parseInt(g.getAttribute('data-go'),10));}
});
$('book').addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('[data-go]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go(parseInt(g.getAttribute('data-go'),10));}});
document.addEventListener('keydown',e=>{
  if(!$('book').classList.contains('opened')||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(pos+(single?1:2));
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(pos-(single?1:2));
  else if(e.key==='Home')go(0);else if(e.key==='End')go(PAGES.length-1);
});
let sx=null;
$('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
$('stage').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60&&$('book').classList.contains('opened'))go(pos+(dx<0?1:-1)*(single?1:2));},{passive:true});
document.addEventListener('error',e=>{if(e.target&&e.target.tagName==='IMG')e.target.classList.add('broken');},true);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(async()=>{
  if(!DATA){setDims();return;}
  const ratio=pos/Math.max(1,PAGES.length);await layout();pos=Math.min(PAGES.length-1,Math.round(ratio*PAGES.length));if(!single)pos-=pos%2;render();
},250);});

try{if(localStorage.getItem('corpus-hand')==='1')$('desk').classList.add('hand');}catch(e){}
setDims();
setTimeout(()=>{try{$('q').focus({preventScroll:true});}catch(e){}},300);
})();
</script>
